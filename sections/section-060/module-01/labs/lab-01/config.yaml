# Troubleshoot With Kiali
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-060-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane, plus the prometheus and kiali addons"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-060-01-setup"
      description: "Creates the starting state in `kiali-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "wait-for-istiod"
      description: "Waits for the validating webhook to answer before applying Istio objects"
      type: "file"
      source: "testing/wait-for-istiod.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-addons-running"
      description: "Confirms the Prometheus and Kiali addons are Running"
      type: "file"
      source: "validation/validate-addons-running.sh"
    - name: "validate-config-valid"
      description: "Confirms istioctl analyze reports no issues in kiali-demo"
      type: "file"
      source: "validation/validate-config-valid.sh"
    - name: "validate-graph-has-traffic"
      description: "Confirms request metrics exist for the tester to notification-service edge"
      type: "file"
      source: "validation/validate-graph-has-traffic.sh"

teardown:
  keepCluster: false
