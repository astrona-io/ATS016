# Reference solution for ats-016-capstone-060.
#
# One owner for the host, no fault injection, no dangling subset, and access
# logging declared for the namespace.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: access-logs
  namespace: obscapstone-demo
spec:
  accessLogging:
    - providers:
        - name: envoy
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: notification
  namespace: obscapstone-demo
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
