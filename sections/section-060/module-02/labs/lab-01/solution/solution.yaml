# Reference solution for ats-016-lab-060-02.
#
# The fault-injecting VirtualService is removed; the namespace routes to the
# Service with Istio's defaults, and a Telemetry object declares access logging
# for the namespace.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: access-logs
  namespace: metrics-demo
spec:
  accessLogging:
    - providers:
        - name: envoy
