# Troubleshoot With Prometheus And Grafana
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-060-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane, plus the prometheus and grafana addons"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-060-02-setup"
      description: "Creates the starting state in `metrics-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "wait-for-istiod"
      description: "Waits for the validating webhook to answer before applying Istio objects"
      type: "file"
      source: "testing/wait-for-istiod.sh"
  manifests:
    - name: "reference-solution"
      description: "The correct end state a perfect learner produces; used by `astrona test`."
      type: "file"
      source: "solution/solution.yaml"

validation:
  scripts:
    - name: "validate-addons-running"
      description: "Confirms the Prometheus and Grafana addons are Running"
      type: "file"
      source: "validation/validate-addons-running.sh"
    - name: "validate-fault-removed"
      description: "Confirms the fault-injecting VirtualService is gone and traffic succeeds"
      type: "file"
      source: "validation/validate-fault-removed.sh"
    - name: "validate-metrics-recorded"
      description: "Confirms Prometheus has istio_requests_total series for the workload with a 200 response code"
      type: "file"
      source: "validation/validate-metrics-recorded.sh"

teardown:
  keepCluster: false
