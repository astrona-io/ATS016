# Find Which Caller Is Failing With PromQL
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-060-02-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane, plus the prometheus addon"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-060-02-02-setup"
      description: "Creates two clients in `callers-demo` and a fault that hits only one of them"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "wait-for-istiod"
      description: "Waits for the validating webhook to answer before applying Istio objects"
      type: "file"
      source: "testing/wait-for-istiod.sh"
    - name: "reference-solution"
      description: "The findings and the remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-prometheus-running"
      description: "Confirms the Prometheus addon is Running"
      type: "file"
      source: "validation/validate-prometheus-running.sh"
    - name: "validate-findings"
      description: "Confirms the findings ConfigMap names the failing caller, the reporter and the response flag"
      type: "file"
      source: "validation/validate-findings.sh"
    - name: "validate-fault-removed"
      description: "Confirms the route remains without a fault and both clients get 200"
      type: "file"
      source: "validation/validate-fault-removed.sh"

teardown:
  keepCluster: false
