apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: notification
  namespace: conflict-demo
spec:
  host: notification-service
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
# Problem 1: the catch-all route is first, so the header rule below is dead.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: notification
  namespace: conflict-demo
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
            subset: v1
    - match:
        - headers:
            testing:
              exact: "true"
      route:
        - destination:
            host: notification-service
            subset: v2
---
# Problem 2: a second VirtualService claims the same host.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: notification-extra
  namespace: conflict-demo
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
            subset: v1
