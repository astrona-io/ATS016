# Declare The Service Port Protocol So The Route Applies
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-040-02-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-040-02-02-setup"
      description: "Creates the starting state in `portproto-demo`: two versions, header routing, and a Service port declared as TCP"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "wait-for-istiod"
      description: "Waits for the validating webhook to answer before applying Istio objects"
      type: "file"
      source: "testing/wait-for-istiod.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-port-protocol"
      description: "Confirms the notification-service port declares HTTP and still maps 80 to 8084"
      type: "file"
      source: "validation/validate-port-protocol.sh"
    - name: "validate-http-route-exists"
      description: "Confirms the tester proxy holds an HTTP route for notification-service with the header rule first"
      type: "file"
      source: "validation/validate-http-route-exists.sh"
    - name: "validate-header-routing"
      description: "Confirms testing=true reaches v2 and every other request reaches v1"
      type: "file"
      source: "validation/validate-header-routing.sh"

teardown:
  keepCluster: false
