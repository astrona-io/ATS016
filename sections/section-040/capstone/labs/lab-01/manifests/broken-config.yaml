# Fault 1: the route names a subset nothing defines.
# (Fault 2 is in lab-start.yaml: the reporting-service port is named "tcp-web",
#  which declares the protocol tcp, so Istio handles it as plain TCP and builds
#  no HTTP route for it. A name with no known protocol, such as "web", would not
#  be a fault: Istio would detect plain HTTP automatically.)
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: notification
  namespace: dpcapstone-demo
spec:
  host: notification-service
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: notification
  namespace: dpcapstone-demo
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
            subset: canary
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reporting
  namespace: dpcapstone-demo
spec:
  hosts:
    - reporting-service
  http:
    - match:
        - uri:
            prefix: /status
      route:
        - destination:
            host: reporting-service
