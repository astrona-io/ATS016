# Fault 1: the route names a subset nothing defines.
# (Fault 2 is in lab-start.yaml: the reporting-service port is named "web",
#  which declares no protocol, so Istio treats it as plain TCP.)
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: notification
  namespace: dpcapstone-demo
spec:
  host: notification-service
  subsets:
    - name: v1
      labels:
        version: v1
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: notification
  namespace: dpcapstone-demo
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
            subset: canary
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reporting
  namespace: dpcapstone-demo
spec:
  hosts:
    - reporting-service
  http:
    - match:
        - uri:
            prefix: /status
      route:
        - destination:
            host: reporting-service
