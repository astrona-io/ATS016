# Read The Proxy Configuration (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.
#
# Runtime: kind cluster by default (no `runtime:` block). For a clean VM over
# SSH with no Kubernetes, add a `runtime:` block with type "qemu" — see
# references/astrona-cli.md in the skill. `scripts/scaffold_playground.sh
# --runtime qemu` appends a starter block for you.

metadata:
  name: "ats-016-playground-040-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install istioctl, install the Istio control plane, and apply a working DestinationRule and VirtualService so the proxy has real configuration to read."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads (namespace, notification-service Deployment, Service, tester client)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
