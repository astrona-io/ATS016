# Read The Proxy Configuration
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-040-01-setup"
      description: "Creates the starting state in `proxycfg-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "wait-for-istiod"
      description: "Waits for the validating webhook to answer before applying Istio objects"
      type: "file"
      source: "testing/wait-for-istiod.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-subsets-exist"
      description: "Confirms the DestinationRule defines v1 and v2 subsets over the version label"
      type: "file"
      source: "validation/validate-subsets-exist.sh"
    - name: "validate-route-to-v2"
      description: "Confirms the proxy route table sends testing=true to the v2 cluster"
      type: "file"
      source: "validation/validate-route-to-v2.sh"
    - name: "validate-endpoints-healthy"
      description: "Confirms both subset clusters resolve to at least one HEALTHY endpoint"
      type: "file"
      source: "validation/validate-endpoints-healthy.sh"

teardown:
  keepCluster: false
