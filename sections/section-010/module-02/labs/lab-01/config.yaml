# Summarise A Workload With describe And bug-report
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-010-02-setup"
      description: "Creates the starting state in `describe-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  manifests:
    - name: "reference-solution"
      description: "The correct end state a perfect learner produces; used by `astrona test`."
      type: "file"
      source: "solution/solution.yaml"

validation:
  scripts:
    - name: "validate-authz-both-verbs"
      description: "Confirms the AuthorizationPolicy now allows GET as well as POST on notification-service"
      type: "file"
      source: "validation/validate-authz-both-verbs.sh"
    - name: "validate-mtls-strict"
      description: "Confirms the effective PeerAuthentication mode for the workload is still STRICT"
      type: "file"
      source: "validation/validate-mtls-strict.sh"
    - name: "validate-log-level-restored"
      description: "Confirms the proxy rbac log scope was returned to info"
      type: "file"
      source: "validation/validate-log-level-restored.sh"

teardown:
  keepCluster: false
