# Capture A Limited bug-report Archive
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-010-02-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-010-02-02-setup"
      description: "Creates describe-demo and the decoy namespace noise-demo, and removes any old archive"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "wait-for-istiod"
      description: "Waits for the validating webhook to answer before applying Istio objects"
      type: "file"
      source: "testing/wait-for-istiod.sh"
    - name: "reference-solution"
      description: "The capture a correct learner takes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-archive-exists"
      description: "Confirms /tmp/ats-016-bug-report/bug-report.tar.gz exists and can be read"
      type: "file"
      source: "validation/validate-archive-exists.sh"
    - name: "validate-target-captured"
      description: "Confirms the archive holds the notification-service proxy's configuration dump and istiod data"
      type: "file"
      source: "validation/validate-target-captured.sh"
    - name: "validate-no-extra-proxies"
      description: "Confirms no other proxy (tester, noise-demo, gateways) is in the archive"
      type: "file"
      source: "validation/validate-no-extra-proxies.sh"

teardown:
  keepCluster: false
