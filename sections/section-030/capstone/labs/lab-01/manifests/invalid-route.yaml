# Accepted by the API server only because the validating webhook was
# unavailable; istiod refuses it at push time. The weights sum to 120.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: payments-split
  namespace: cpcapstone-demo
spec:
  hosts:
    - payments-service
  http:
    - route:
        - destination:
            host: payments-service
          weight: 60
        - destination:
            host: payments-service
          weight: 60
