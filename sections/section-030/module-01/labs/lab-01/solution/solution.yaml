# Reference solution for ats-016-lab-030-01.
#
# The invalid object may be removed outright; this is the alternative correct
# end state — the same VirtualService with weights that actually sum to 100.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bad-weights
  namespace: cphealth-demo
spec:
  hosts:
    - notification-service
  http:
    - route:
        - destination:
            host: notification-service
          weight: 100
