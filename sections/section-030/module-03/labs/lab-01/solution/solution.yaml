# Reference solution for ats-016-lab-030-03.
# Identical to the starting state except that reporting-service's pod
# template no longer carries the sidecar.istio.io/inject opt-out.
apiVersion: v1
kind: Namespace
metadata:
  name: noinject-demo
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-v1
  namespace: noinject-demo
  labels:
    app: notification-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
      version: v1
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
    spec:
      containers:
        - name: notification-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: notification-service-v1-nginx-conf
---
# This workload opts out at the pod template level.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: noinject-demo
  labels:
    app: reporting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
        - name: reporting-service
          image: mccutchen/go-httpbin:v2.15.0
          command: ["/bin/go-httpbin", "-port", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: noinject-demo
  labels:
    app: reporting-service
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: reporting-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tester
  namespace: noinject-demo
  labels:
    app: tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tester
  template:
    metadata:
      labels:
        app: tester
    spec:
      containers:
        - name: tester
          image: curlimages/curl
          command: ["sh", "-c", "while true; do sleep 30; done"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-v1-nginx-conf
  namespace: noinject-demo
data:
  default.conf: |
    server {
      listen 8084;
      location / {
        default_type application/json;
        return 200 '["EMAIL"]';
      }
    }
