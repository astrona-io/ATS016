# Read Envoy Access Logs And Response Flags
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-016-lab-050-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "ats-016-lab-050-01-setup"
      description: "Creates the starting state in `accesslog-demo` that the task works from"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "wait-for-istiod"
      description: "Waits for the validating webhook to answer before applying Istio objects"
      type: "file"
      source: "testing/wait-for-istiod.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-telemetry-scoped"
      description: "Confirms a Telemetry object enables envoy access logging for accesslog-demo only"
      type: "file"
      source: "validation/validate-telemetry-scoped.sh"
    - name: "validate-timeout-configured"
      description: "Confirms the VirtualService sets a 2s timeout on notification-service"
      type: "file"
      source: "validation/validate-timeout-configured.sh"
    - name: "validate-flag-observed"
      description: "Confirms a UT response flag is present in the client proxy access log"
      type: "file"
      source: "validation/validate-flag-observed.sh"

teardown:
  keepCluster: false
